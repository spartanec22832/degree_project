version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: degree_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - degree_infrastructure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../degree_backend
      dockerfile: Dockerfile
    container_name: degree_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker

  caddy:
    image: caddy:2-alpine
    container_name: degree_caddy
    restart: always
    ports:
      - "80:80"
      - "444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  degree_infrastructure_pgdata:
  caddy_data:
  caddy_config: